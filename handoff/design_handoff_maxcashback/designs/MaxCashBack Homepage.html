<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MaxCashBack — Homepage Redesign</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #f0eee9; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="direction-a.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection
        title="MaxCashBack — homepage, Direction A (v2)"
        subtitle="Prominent search, dedicated ad slots (leaderboard + billboard), Top 30 rates and Top 30 popular side-by-side. Scroll inside the artboard."
      >
        <DCArtboard label="Direction A · 1440w" width={1440} height={1800} style={{ overflow: "auto" }}>
          <DirectionA />
        </DCArtboard>
      </DCSection>

      <DCPostIt top={130} left={40} rotate={-3} width={230}>
        Updates:<br/>
        • 2× ad slots (970×120, 970×250)<br/>
        • Top 30 rates + Top 30 popular, side-by-side<br/>
        • "What just changed" removed<br/>
        • Search taller + more prominent
      </DCPostIt>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
