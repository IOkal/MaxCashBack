<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MaxCashBack — Store Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #f0eee9; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="direction-a.jsx"></script>
<script type="text/babel" src="store-page.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection
        title="Store page — adidas Canada"
        subtitle="Best rate hero, full portal comparison with sidebar ad, 30-day history chart + daily log, related stores. Small 'coming soon' card hints at card stacking."
      >
        <DCArtboard label="Store page · 1440w" width={1440} height={2200} style={{ overflow: "auto" }}>
          <StorePage />
        </DCArtboard>
      </DCSection>

      <DCPostIt top={130} left={40} rotate={-3} width={240}>
        Core screen — the money shot.<br/><br/>
        Layout: hero best-rate card → full comparison table (w/ 300×600 sidebar ad) → 30d history → similar stores.
      </DCPostIt>
      <DCPostIt top={220} right={40} rotate={2} width={220}>
        "Stack with your card" sits quietly in the sidebar — a hook for the future credit-card feature without taking focus.
      </DCPostIt>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
