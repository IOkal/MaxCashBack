name: Daily Cashback Scrape

on:
  schedule:
    # Run twice daily: 8am and 8pm UTC (3am and 3pm EST)
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd scrapers
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Run GCR scraper
        id: gcr
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd scrapers
          python gcr_scraper.py

      - name: Run Rakuten scraper
        id: rakuten
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd scrapers
          python rakuten_scraper.py

      - name: Run Aeroplan scraper
        id: aeroplan
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd scrapers
          python aeroplan_scraper.py

      - name: Run TopCashback scraper
        id: tcb
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd scrapers
          python tcb_scraper.py

      - name: Run Swagbucks scraper
        id: swagbucks
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd scrapers
          python swagbucks_scraper.py

      - name: Run Air Miles scraper
        id: airmiles
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd scrapers
          python airmiles_scraper.py

      - name: Alert on scraper failure
        if: steps.gcr.outcome == 'failure' || steps.rakuten.outcome == 'failure' || steps.aeroplan.outcome == 'failure' || steps.tcb.outcome == 'failure' || steps.swagbucks.outcome == 'failure' || steps.airmiles.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAILED=""
          [ "${{ steps.gcr.outcome }}" = "failure" ] && FAILED="$FAILED- GCR\n"
          [ "${{ steps.rakuten.outcome }}" = "failure" ] && FAILED="$FAILED- Rakuten\n"
          [ "${{ steps.aeroplan.outcome }}" = "failure" ] && FAILED="$FAILED- Aeroplan\n"
          [ "${{ steps.tcb.outcome }}" = "failure" ] && FAILED="$FAILED- TopCashback\n"
          [ "${{ steps.swagbucks.outcome }}" = "failure" ] && FAILED="$FAILED- Swagbucks\n"
          [ "${{ steps.airmiles.outcome }}" = "failure" ] && FAILED="$FAILED- Air Miles\n"

          gh issue create \
            --title "Scraper failure on $(date -u +%Y-%m-%d %H:%M UTC)" \
            --label "scraper-alert" \
            --body "$(printf "The following scrapers failed during the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}):\n\n${FAILED}\nData from the last successful run is still being served (at most 12h old). Check the run logs for details.")"
